# DB_PASSWORD for the game-server Deployment. The value below is the base64 encoding of the
# same "secretpassword" demo placeholder used throughout docker-compose.yml/init-db.sql -
# fine for local/demo use, but replace it (and generate this manifest via `kubectl create
# secret generic ... --from-literal` or a real secrets manager/sealed-secrets/external-
# secrets setup, not a plaintext YAML file committed to git) before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: kungfu-gameserver-secret
  labels:
    app: kungfu-gameserver
type: Opaque
data:
  DB_PASSWORD: c2VjcmV0cGFzc3dvcmQ=  # "secretpassword"
