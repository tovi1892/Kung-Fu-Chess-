# Docker Compose setup for local cloud-ready development environment
version: '3.8'

services:
  # 1. Relational Database for User Profiles, Auth & Historic Logs
  postgres:
    image: postgres:16-alpine
    container_name: kungfu_postgres
    restart: always
    environment:
      POSTGRES_USER: kungfu_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: kungfu_chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu_admin -d kungfu_chess"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. In-Memory Cache & Session / Room Routing Store
  redis:
    image: redis:7-alpine
    container_name: kungfu_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Kung-Fu Chess C++ Game Server Pod (Containerized)
  game-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: kungfu_gameserver
    restart: unless-stopped
    ports:
      - "8080:8080" # WebSocket port for clients
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kungfu_admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=kungfu_chess
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: