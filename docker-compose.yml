# Docker Compose setup for local cloud-ready development environment
services:
  # 1. Relational Database for User Profiles, Auth & Historic Logs
  postgres:
    image: postgres:16-alpine
    container_name: kungfu_postgres
    restart: always
    environment:
      POSTGRES_USER: kungfu_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: kungfu_chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu_admin -d kungfu_chess"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. In-memory store for the Gateway's room->shard routing (see Gateway/RedisRoomRegistry.hpp)
  # - only ever consulted for freeform JoinRoom keys, not CreateRoom's shard-index-prefixed
  # ones (see Gateway/WsGateway.hpp), but real enough to be worth a real Redis rather than
  # the Gateway's in-process fallback the moment there's more than one game-server shard.
  redis:
    image: redis:7-alpine
    container_name: kungfu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3/4. Two Kung-Fu Chess C++ Game Server Shards (Containerized) - each an independent,
  # authoritative GameEngine/RoomManager, both sharing the same Postgres account DB (see
  # Server_Design.md's scaling rationale). No host port exposed deliberately: real clients go
  # through the gateway service below, not directly to a shard - only reachable from other
  # containers on the compose network, by service name (game-server-N:8080).
  game-server-1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: kungfu_gameserver_1
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kungfu_admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=kungfu_chess
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

  game-server-2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: kungfu_gameserver_2
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kungfu_admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=kungfu_chess
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Standalone cross-shard QuickMatch pairing service (see Matchmaker/Matchmaker.hpp) - the
  # fix for two shards' independent in-process RoomManager waiting lists never being able to
  # see each other. SHARD_COUNT must be kept in sync with the gateway service's SHARD_URLS
  # list length below (a manual deployment invariant, same kind this file already has for the
  # two game-server-N services above).
  matchmaker:
    build:
      context: .
      dockerfile: Dockerfile.matchmaker
    container_name: kungfu_matchmaker
    restart: unless-stopped
    environment:
      - MATCHMAKER_PORT=9100
      - SHARD_COUNT=2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  # 6. WebSocket Gateway - routes each connection across the shard list above (see
  # Gateway/WsGateway.hpp). This is the one service real clients actually connect to; it has
  # no account-database access, and only decodes just enough of the protocol (LOGIN/JOIN/ROOM)
  # to route correctly - CLICK/STATE traffic is pure byte relay exactly as before this existed.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: kungfu_gateway
    restart: unless-stopped
    ports:
      - "9000:9000" # WebSocket port for clients
    environment:
      - GATEWAY_PORT=9000
      - SHARD_URLS=ws://game-server-1:8080,ws://game-server-2:8080
      - MATCHMAKER_URL=ws://matchmaker:9100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      game-server-1:
        condition: service_healthy
      game-server-2:
        condition: service_healthy
      matchmaker:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 7. Stateless REST API Gateway - login/register/profile/leaderboard over HTTP, decoupled
  # from the realtime WS path (see ApiGateway/ApiGateway.hpp). Shares the same Postgres
  # account DB as the game-server shards; has no relationship to the WS gateway service
  # above (no session-token handoff between them yet - see ApiGateway.hpp's comment).
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.apigateway
    container_name: kungfu_api_gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kungfu_admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=kungfu_chess
      - API_GATEWAY_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: